version: '3.8'

services:
  # ------------------------------------------------------------
  # 1. INFRASTRUCTURE (Database & Queue)
  # ------------------------------------------------------------
  mongo:
    image: mongo
    container_name: nexaminds-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: nexaminds-rabbitmq
    ports:
      - "5672:5672"   # AMQP Protocol
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # 2. MICROSERVICES
  # ------------------------------------------------------------
  
  # Auth Service (Port 3001)
  auth-service:
    build: ./auth-service
    expose:
      - "${AUTH_PORT}"
    environment:
      - PORT=${AUTH_PORT}
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongo


  # Email Service (Port 3003 - Hybrid API + Worker)
  email-service:
    build: ./email-service
    container_name: email-ms
    expose:
      - "${EMAIL_PORT}"
    environment:
      - PORT=${EMAIL_PORT}
      - RABBITMQ_URL=${RABBITMQ_URL}
    depends_on:
      rabbitmq:
        condition: service_healthy

  # URL Builder Service (Port 3002)
  url-builder-service:
    build: ./url-builder-service
    container_name: url-builder-ms
    expose:
      - ${URL_BUILDER_PORT}
    environment:
      - PORT=${URL_BUILDER_PORT}
      # Service Discovery via Docker DNS names
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - EMAIL_SERVICE_URL=${EMAIL_SERVICE_URL}
    depends_on:
      - auth-service
      - email-service

  # ------------------------------------------------------------
  # 3. ENTRY POINT
  # ------------------------------------------------------------
  
  # API Gateway (Port 3000)
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    environment:
      - PORT=${GATEWAY_PORT}
    depends_on:
      - auth-service
      - url-builder-service
      - email-service

volumes:
  mongo_data: