server:
  port: 8080

spring:
  application:
    name: microservices-blueprint-kotlin
  datasource:
    url: jdbc:h2:mem:microservicesdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: c3VwZXJzZWNyZXRrZXlmb3JzcHJpbmdib290amF2YW1pY3Jvc2VydmljZXNibHVlcHJpbnQ=
  expirationMs: 86400000
